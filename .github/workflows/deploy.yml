name: Deploy Beijo da Rua (SSG) via FTP

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install project dependencies
        run: npm ci

      - name: Install Puppeteer with Chrome
        run: |
          npm install puppeteer
          npx puppeteer browsers install chrome

      - name: Build Vite project
        run: npm run build

      - name: Verify dist directory
        run: |
          echo "📁 Checking dist/ contents..."
          ls -la dist/
          echo ""
          echo "📄 Main index.html preview:"
          head -50 dist/index.html

      - name: Run SSG (Static Site Generation)
        run: |
          echo "🚀 Starting SSG process..."
          node scripts/generate-static.js
        env:
          CI: true

      - name: List generated static pages
        run: |
          echo "📋 Generated index.html files:"
          find dist -name "index.html" | sort
          echo ""
          echo "📊 Total pages: $(find dist -name 'index.html' | wc -l)"

      - name: Verify SSG output (sample check)
        run: |
          echo "🔍 Checking sample page content..."
          if [ -f "dist/sobre-nos/index.html" ]; then
            echo "✓ /sobre-nos/index.html exists"
            echo "First 30 lines:"
            head -30 dist/sobre-nos/index.html
          else
            echo "⚠ /sobre-nos/index.html not found"
          fi

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          port: 21
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./dist/
          server-dir: /
          dangerous-clean-slate: false
          dry-run: false
          log-level: verbose
