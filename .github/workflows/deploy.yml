name: Deploy Lovable via FTP na Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar o repositório
        uses: actions/checkout@v3

      - name: Configurar Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Instalar dependências
        run: npm install

      - name: Build do projeto (gera a SPA temporária)
        run: npm run build

      - name: Instalar o servidor estático 'serve'
        run: npm install -g serve

      - name: Iniciar servidor local com a SPA
        run: |
          serve -s dist &
          echo $! > .pidfile
        # Roda o 'serve' em background

      - name: Aguardar servidor ficar pronto
        run: sleep 10

      - name: Executar script de SSG com Puppeteer
        run: node scripts/generate-static.js

      - name: Matar o servidor local
        run: |
          if [ -f .pidfile ]; then
            kill $(cat .pidfile)
            rm .pidfile
          fi

      - name: Verificar estrutura SSG gerada (debug)
        run: |
          echo "Estrutura final do dist/:"
          find dist -name "index.html" | sort

      - name: Deploy FTP para Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          port: 21
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./dist/
          server-dir: /
          dangerous-clean-slate: false  # ⚠️ Mais seguro
          dry-run: false
          log-level: verbose
